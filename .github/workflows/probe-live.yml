name: Probe - live F&O feeds

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_live.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests curl_cffi
      - run: python scripts/probe_live.py
