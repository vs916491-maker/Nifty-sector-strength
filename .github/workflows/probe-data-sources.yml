name: Phase 1 - Data source test

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/probe_sources.py"
      - ".github/workflows/probe-data-sources.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install requests
        run: pip install requests

      - name: Probe NSE and Yahoo data sources
        run: python scripts/probe_sources.py

      - name: Save raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-results
          path: probe_output/
