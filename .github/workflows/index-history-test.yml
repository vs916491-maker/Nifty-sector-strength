name: One-off index history download (test only)

# Downloads NSE index closes for a date range and pushes them to the branch test/index-history.
# Does not touch main or data/.
on:
  workflow_dispatch:
    inputs:
      start: { description: "First day (YYYY-MM-DD)", required: true, default: "2023-01-01" }
      end: { description: "Last day (YYYY-MM-DD)", required: true, default: "2023-10-02" }

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch index files
        env:
          START: ${{ github.event.inputs.start }}
          END: ${{ github.event.inputs.end }}
        run: |
          python - <<'PY'
          import datetime as dt, os
          from pathlib import Path
          from collector import config
          from collector.nse import NSEClient
          from collector.update import collect_daily, parse_index_file
          s = dt.date.fromisoformat(os.environ["START"]); e = dt.date.fromisoformat(os.environ["END"])
          print(collect_daily(NSEClient(), Path("out"), config.INDEX_CLOSE_URL, parse_index_file, ["date", "index"], s, e))
          PY
      - name: Push to test branch
        run: |
          mkdir -p /tmp/o && cp -r out /tmp/o/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git checkout --orphan test/index-history
          git rm -rq --cached . && find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/o/out ./index-history
          git add index-history && git commit -qm "Index history test download"
          git push -f origin test/index-history
